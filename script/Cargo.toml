[package]
name = "script"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "prove"
path = "src/main.rs"

[dependencies]
sp1-sdk = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
sp1-build = "3.0"