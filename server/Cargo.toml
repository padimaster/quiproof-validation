[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { version = "0.22", features = ["alloc"] }
bincode = "1.3"
sp1-sdk = "5.0.8"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"

[build-dependencies]
sp1-build = "5.0.8"