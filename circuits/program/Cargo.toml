[package]
version = "0.1.0"
name = "age-proof-program"
edition = "2021"

[dependencies]
sp1-zkvm = "5.0.8"
serde = { version = "1.0", features = ["derive"] }
# For certificate and CMS parsing
der = "0.7"
x509-parser = "0.16"
sha2 = "0.10"
base64 = "0.22"
# For RSA signature verification
rsa = { version = "0.9", default-features = false }
signature = { version = "2.0", default-features = false }
pkcs1 = { version = "0.7", default-features = false }
pkcs8 = { version = "0.10", default-features = false }
num-bigint-dig = { version = "0.8", default-features = false, features = ["std"] }
